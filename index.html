<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARRY'S ROOM — Official Drop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Ambient Glow Effect */
        .glow {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 480px;
            width: 100%;
            z-index: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 25px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .tag {
            display: inline-block;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 20px;
            border: 1px solid #333;
            padding: 4px 14px;
            border-radius: 20px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Countdown Grid */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 8px;
            border-radius: 8px;
            min-width: 65px;
        }

        .number {
            font-size: 1.4rem;
            font-weight: 700;
            display: block;
        }

        .label {
            font-size: 0.6rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Form Styling */
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="email"] {
            width: 100%;
            padding: 15px;
            background: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: border 0.3s ease;
            text-align: center;
            letter-spacing: 1px;
        }

        input[type="email"]:focus {
            border-color: #ffffff;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.3s ease;
        }

        button:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 35px;
            font-size: 0.65rem;
            color: #444;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container">
        <span class="tag">Drop 01 — Limited Access</span>
        <h1>Harry's Room</h1>
        <p class="subtitle">Trage deine E-Mail ein, um den exklusiven Access-Code vor dem öffentlichen Launch zu erhalten.</p>

        <!-- Countdown Timer -->
        <div class="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Tage</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Std</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Min</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Sek</span>
            </div>
        </div>

        <!-- Email Input -->
        <form>
            <input type="email" placeholder="DEINE E-MAIL ADRESSE" required>
            <button type="submit">Zugang Anfordern</button>
        </form>
    </div>

    <footer>
        &copy; HARRY'S ROOM. ALL RIGHTS RESERVED.
    </footer>

    <script>
        // Countdown auf 7 Tage ab jetzt setzen
        const launchDate = new Date().getTime() + (7 * 24 * 60 * 60 * 1000);

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown").innerHTML = "DROP IS LIVE";
            }
        }, 1000);
    </script>
</body>
</html>
