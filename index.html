<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARRY'S ROOM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            text-align: center;
            background-color: #141414;
            border-bottom: 1px solid #222;
        }

        header h1 {
            font-size: 1.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            width: 100%;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .product-card {
            background: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #1a1a1a;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 15px;
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background: #ddd;
        }

        /* Warenkorb Styling */
        .cart-section {
            background: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .cart-section h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .cart-items {
            list-style: none;
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: right;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            background: #0070ba;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .checkout-btn:hover {
            background: #005ea6;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 0.8rem;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <header>
        <h1>HARRY'S ROOM</h1>
    </header>

    <div class="container">
        <div class="products-grid">
            <!-- Produkt: Matrix -->
            <div class="product-card">
                <img class="product-img" src="IMG_1132.jpeg" alt="Matrix">
                <div>
                    <div class="product-title">Matrix</div>
                    <div class="product-price">19,99 €</div>
                </div>
                <button class="add-btn" onclick="addToCart('Matrix', 19.99)">In den Warenkorb</button>
            </div>
        </div>

        <!-- Warenkorb Bereich -->
        <div class="cart-section">
            <h2>Dein Warenkorb</h2>
            <ul id="cart-list" class="cart-items">
                <li style="color: #666;">Der Warenkorb ist leer.</li>
            </ul>
            <div class="cart-total">
                Gesamtsumme: <span id="cart-sum">0,00</span> €
            </div>
            <button class="checkout-btn" onclick="checkout()">Mit PayPal bezahlen</button>
        </div>
    </div>

    <footer>
        &copy; 2026 HARRY'S ROOM. Alle Rechte vorbehalten.
    </footer>

    <script>
        const paypalEmail = "nandokhan585@gmail.com";
        let cart = [];

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCart();
        }

        function updateCart() {
            const list = document.getElementById("cart-list");
            const sumElement = document.getElementById("cart-sum");
            
            if (cart.length === 0) {
                list.innerHTML = '<li style="color: #666;">Der Warenkorb ist leer.</li>';
                sumElement.innerText = "0,00";
                return;
            }

            list.innerHTML = "";
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                const li = document.createElement("li");
                li.className = "cart-item";
                li.innerHTML = `<span>${item.name}</span> <span>${item.price.toFixed(2).replace('.', ',')} €</span>`;
                list.appendChild(li);
            });

            sumElement.innerText = total.toFixed(2).replace('.', ',');
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Dein Warenkorb ist leer!");
                return;
            }

            let total = cart.reduce((sum, item) => sum + item.price, 0).toFixed(2);
            let itemNames = cart.map(item => item.name).join(", ");

            // Weiterleitung zu PayPal Checkout mit deiner E-Mail
            let paypalUrl = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=${encodeURIComponent(paypalEmail)}&item_name=${encodeURIComponent(itemNames)}&amount=${total}&currency_code=EUR`;
            
            window.location.href = paypalUrl;
        }
    </script>
</body>
</html>
