<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop mit Admin-Dashboard & PayPal</title>
    <!-- PayPal SDK einbinden (clientId für Live/Sandbox anpassen) -->
    <script src="https://www.paypal.com/sdk/js?client-id=test&currency=EUR"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background: #111;
            color: #fff;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; font-size: 24px; }
        
        /* Admin Button */
        .admin-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }
        .admin-btn:hover { background: #444; }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Admin Dashboard Modal / Box */
        #admin-panel {
            display: none;
            background: #fff;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        #admin-panel h3 { margin-top: 0; }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-save {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn-save:hover { background: #218838; }

        /* Produkt-Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #fff;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
            background: #eee;
            margin-bottom: 15px;
        }
        .product-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .product-desc { font-size: 14px; color: #666; margin-bottom: 15px; flex-grow: 1; }
        .product-price { font-size: 20px; font-weight: bold; color: #0070ba; margin-bottom: 15px; }
        
        .paypal-container {
            margin-top: 10px;
        }
        
        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mein Shop</h1>
        <button class="admin-btn" onclick="openAdmin()">⚙️ Admin Settings</button>
    </header>

    <div class="container">
        <!-- Admin Dashboard (Anfangs versteckt) -->
        <div id="admin-panel">
            <h3>Admin Dashboard - Neues Produkt hochladen</h3>
            <div class="form-group">
                <label for="p-title">Produkttitel:</label>
                <input type="text" id="p-title" placeholder="z.B. Pokémon Booster Box">
            </div>
            <div class="form-group">
                <label for="p-price">Preis (€):</label>
                <input type="number" id="p-price" step="0.01" placeholder="29.99">
            </div>
            <div class="form-group">
                <label for="p-desc">Beschreibung:</label>
                <textarea id="p-desc" placeholder="Zustand, Details..."></textarea>
            </div>
            <div class="form-group">
                <label for="p-img">Bild URL:</label>
                <input type="text" id="p-img" placeholder="https://beispiel.de/bild.jpg">
            </div>
            <button class="btn-save" onclick="addProduct()">Produkt hochladen & veröffentlichen</button>
        </div>

        <h2>Verfügbare Produkte</h2>
        <!-- Hier landen dynamisch alle Produkte -->
        <div id="product-list" class="product-grid">
            <!-- Produkte werden per JavaScript geladen -->
        </div>
    </div>

    <script>
        // Passwort-Abfrage für Admin-Panel
        function openAdmin() {
            const pw = prompt("Bitte Admin-Passwort eingeben:");
            if (pw === "3636") {
                const panel = document.getElementById("admin-panel");
                panel.style.display = panel.style.display === "block" ? "none" : "block";
            } else if (pw !== null) {
                alert("Falsches Passwort!");
            }
        }

        // Standard-Produkte falls noch keine da sind
        let products = JSON.parse(localStorage.getItem("shop_products")) || [
            { id: 1, title: "Beispiel Pokémon Karte", price: "14.99", desc: "Top Zustand, Holo Rare.", img: "https://images.unsplash.com/photo-1613771404784-3a5686aa2be3?w=500" }
        ];

        // Produkte rendern
        function renderProducts() {
            const listEl = document.getElementById("product-list");
            listEl.innerHTML = "";

            if (products.length === 0) {
                listEl.innerHTML = "<p>Noch keine Produkte vorhanden. Nutze die Admin-Settings (Passwort: 3636) um welche hinzuzufügen.</p>";
                return;
            }

            products.forEach((prod, index) => {
                const card = document.createElement("div");
                card.className = "product-card";
                
                card.innerHTML = `
                    <div>
                        <img src="${prod.img || 'https://via.placeholder.com/300'}" alt="${prod.title}">
                        <div class="product-title">${prod.title}</div>
                        <div class="product-desc">${prod.desc}</div>
                        <div class="product-price">${prod.price} €</div>
                    </div>
                    <div>
                        <div id="paypal-button-container-${index}" class="paypal-container"></div>
                        <button class="delete-btn" onclick="deleteProduct(${index})">Produkt löschen (Admin)</button>
                    </div>
                `;
                
                listEl.appendChild(card);

                // PayPal Button für jedes Produkt initialisieren
                paypal.Buttons({
                    createOrder: function(data, actions) {
                        return actions.order.create({
                            purchase_units: [{
                                amount: {
                                    value: prod.price
                                }
                            }]
                        });
                    },
                    onApprove: function(data, actions) {
                        return actions.order.capture().then(function(details) {
                            alert('Vielen Dank für den Kauf, ' + details.payer.name.given_name + '!');
                        });
                    }
                }).render('#paypal-button-container-' + index);
            });
        }

        // Neues Produkt hinzufügen
        function addProduct() {
            const title = document.getElementById("p-title").value;
            const price = document.getElementById("p-price").value;
            const desc = document.getElementById("p-desc").value;
            const img = document.getElementById("p-img").value;

            if (!title || !price) {
                alert("Bitte mindestens Titel und Preis angeben!");
                return;
            }

            const newProd = { id: Date.now(), title, price, desc, img };
            products.push(newProd);
            localStorage.setItem("shop_products", JSON.stringify(products));

            // Felder leeren und Panel schließen
            document.getElementById("p-title").value = "";
            document.getElementById("p-price").value = "";
            document.getElementById("p-desc").value = "";
            document.getElementById("p-img").value = "";
            document.getElementById("admin-panel").style.display = "none";

            renderProducts();
            alert("Produkt erfolgreich hochgeladen!");
        }

        // Produkt löschen
        function deleteProduct(index) {
            const pw = prompt("Zum Löschen Admin-Passwort eingeben:");
            if (pw === "3636") {
                products.splice(index, 1);
                localStorage.setItem("shop_products", JSON.stringify(products));
                renderProducts();
            } else if (pw !== null) {
                alert("Falsches Passwort!");
            }
        }

        // Beim Laden der Seite ausführen
        renderProducts();
    </script>
</body>
</html>
